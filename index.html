<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>moka129 | Personal Projects</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #f7f7f7;
      color: #333;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 80px 24px;
    }

    header {
      margin-bottom: 64px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 36px;
      font-weight: 700;
    }

    header p {
      margin: 0;
      color: #666;
      line-height: 1.7;
    }

    h2 {
      margin-bottom: 24px;
      font-size: 22px;
    }

    .project {
      display: block;
      padding: 24px;
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .project:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
    }

    .project h3 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .project p {
      margin: 0;
      color: #666;
      line-height: 1.6;
    }

    footer {
      margin-top: 80px;
      padding-top: 24px;
      border-top: 1px solid #ddd;
      color: #888;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main>

    <header>
      <h1>moka129</h1>
      <p>
        個人で開発しているアプリやツールを紹介しています。
      </p>
    </header>

    <section>
      <h2>Projects</h2>

      <a class="project" href="./gctimeline/">
        <h3>GC Timeline</h3>
        <p>
          Google Calendarの予定をiPhoneのホーム画面で確認するための
          カレンダーウィジェットです。
        </p>
      </a>
    </section>

    <footer>
      © moka129
    </footer>

  </main>
</body>
</html>
